[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninety-plus-data-api"
version = "0.1.0"
description = "Reproducible FPL snapshot ingestion and normalized data API"
requires-python = ">=3.9"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.2",
  "httpx==0.28.1",
  "numpy==2.0.2",
  "pydantic==2.11.9",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
